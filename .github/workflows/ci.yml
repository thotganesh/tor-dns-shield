name: ci
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh scripts/*.sh
  generator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyyaml
      - name: Generator tests
        run: python3 tests/test_generator.py
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          docker build -t tds-tor docker/tor
          docker build -t tds-dnscrypt docker/dnscrypt
      - name: Tor ships GeoIP data and both transports
        run: |
          docker run --rm --entrypoint sh tds-tor -c 'ls /usr/share/tor/geoip /usr/bin/snowflake-client /usr/bin/obfs4proxy'
